name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set!"
            exit 1
          fi
          
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java full version string: $JAVA_VER"
          
          if [ -z "$JAVA_VER" ]; then
            echo "ERROR: Unable to detect Java version string!"
            exit 1
          fi
          
          JAVA_MAJOR=$(echo "$JAVA_VER" | awk -F. '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"
          
          if [ -z "$JAVA_MAJOR" ] || ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Failed to parse Java major version from '$JAVA_VER'!"
            exit 1
          fi
          
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java major version ($JAVA_MAJOR) is lower than 17! Java 17 or newer is required."
            exit 1
          fi
          
          echo "Java environment verified successfully: Java $JAVA_MAJOR is active (>= 17)."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          
      - name: Create temporary debug keystore
        run: |
          echo "=== Temporary Debug Keystore Check ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in repository root."
          else
            echo "Generating temporary debug.keystore using Java 17 keytool..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: debug.keystore could not be verified or created!"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        id: build_step
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK output
        if: steps.build_step.outcome == 'success'
        run: |
          echo "=== Verifying Debug APK Output ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at $EXPECTED_APK"
            exit 1
          fi
          echo "Verified: $EXPECTED_APK exists."

      - name: Upload debug APK artifact
        if: steps.build_step.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        if: steps.build_step.outcome == 'success'
        id: prepare_asset
        run: |
          echo "=== Preparing Release Asset ==="
          RUNNER_TEMP_DIR="${RUNNER_TEMP:-/tmp}/apk_release_staging"
          mkdir -p "$RUNNER_TEMP_DIR"
          
          REPO_RAW="${{ github.repository }}"
          REPO_NAME="${REPO_RAW##*/}"
          REPO_CLEAN=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9._-' '-' | sed 's/^-//;s/-$//')
          if [ -z "$REPO_CLEAN" ]; then
            REPO_CLEAN="android-app"
          fi
          
          RELEASE_FILENAME="${REPO_CLEAN}-debug-build-${{ github.run_number }}.apk"
          RELEASE_ASSET_PATH="${RUNNER_TEMP_DIR}/${RELEASE_FILENAME}"
          
          cp "app/build/outputs/apk/debug/app-debug.apk" "$RELEASE_ASSET_PATH"
          
          echo "asset_path=$RELEASE_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        if: steps.build_step.outcome == 'success'
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing to GitHub Releases ==="
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_COMMIT="${{ github.sha }}"
          
          NOTES=$(cat << 'EOF'
          ### Debug APK Build

          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.

          - **GitHub Actions Run Number:** ${{ github.run_number }}
          - **Source Commit SHA:** ${{ github.sha }}

          > **Note:**
          > - This APK is intended for testing.
          > - This APK is signed only with a temporary debug keystore.
          EOF
          )
          
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "$TARGET_COMMIT" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Workflow Summary & Release Report ==="
          
          if [ "${{ steps.build_step.outcome }}" != "success" ]; then
            echo "::error ::The APK Build FAILED! Check the 'Build debug APK' step logs for compiler errors."
            {
              echo "## ❌ APK Build Failed"
              echo ""
              echo "The Gradle build process failed. Please click on the **'Build debug APK'** step in the GitHub Actions log to see the exact compilation error."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release published successfully."
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}")
            RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
            
            {
              echo "## 📱 Debug APK Build Succeeded!"
              echo ""
              echo "### 🚀 GitHub Release"
              echo "The debug APK has been published successfully:"
              echo "- **Release Page:** [$RELEASE_TITLE]($RELEASE_URL)"
              echo "- **Download APK:** You can download **$ASSET_NAME** directly from the **Assets** section on the release page."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning ::APK built successfully, but GitHub Release publishing failed."
            {
              echo "## ⚠️ APK Built Successfully (Release Publishing Warning)"
              echo "The APK built successfully, but publishing to GitHub Releases failed."
              echo "Download the APK from the 'app-debug-apk' artifact below."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
