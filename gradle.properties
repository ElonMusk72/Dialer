# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
org.gradle.parallel=true

# Kotlin code style
kotlin.code.style=official

# Enables namespacing of each library's R class
android.nonTransitiveRClass=true

# ✅ REQUIRED: Enable AndroidX to fix the dependency resolution crash
android.useAndroidX=true

org.gradle.caching=true

# ❌ DISABLED: Configuration cache is crashing due to a known AGP bug.
# We turn it off so the build can actually complete successfully.
org.gradle.configuration-cache=false

# Set the maximum number of workers to 4
org.gradle.workers.max=4

# Set the Kotlin compiler execution strategy to in-process
kotlin.compiler.execution.strategy=in-process

# Allow the google-services plugin to work even if the google-services.json is not present.
googleServices.missing.passthrough=true
